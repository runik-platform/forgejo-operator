name: publish-forgejo-operator

on:
  push:
    tags:
      - "v*-runik.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: forgejo-operator-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/runik-platform/forgejo-operator

jobs:
  publish:
    name: Publish image, installer, and release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release contract
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-runik\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported fork release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          declared_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${version}" != "${declared_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match VERSION ${declared_version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate installer asset
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          make build-installer IMG="${IMAGE}:${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing image
        id: image
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and publish image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Create GitHub release and upload installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_args=()
            if [[ "${RELEASE_TAG#v}" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" --verify-tag \
              --title "${RELEASE_TAG}" --generate-notes "${release_args[@]}"
          fi
          gh release upload "${RELEASE_TAG}" dist/install.yaml \
            --clobber --repo "${GITHUB_REPOSITORY}"
